<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starter melden</title>
    <link rel="stylesheet" href="/css/portal.css">
</head>
<!-- The club's entry sheet: one row per starter, one column per ranking entry -->
<body>
    <div class="wrap">
        <div class="topbar">
            <div style="min-width:0">
                <span class="label" id="club-name"></span>
                <h1 id="meet-name" data-i18n="sheet.title">Starter melden</h1>
                <p class="muted" style="margin:2px 0 0" id="deadline"></p>
            </div>
            <div class="actions">
                <div class="seg" role="group" data-i18n-aria-label="common.language">
                    <button type="button" data-lang="de">DE</button><button type="button" data-lang="en">EN</button>
                </div>
                <button type="button" class="btn" id="logout" data-i18n="common.logout">Abmelden</button>
            </div>
        </div>

        <p id="load-error" class="notice bad" hidden></p>
        <p id="closed" class="notice warn" hidden data-i18n="sheet.closed"></p>

        <section class="card" id="contact-card">
            <h2 data-i18n="sheet.contactTitle">Ansprechperson</h2>
            <div class="fields">
                <div class="field"><label for="c-name" data-i18n="sheet.contactName">Name</label><input id="c-name" type="text" autocomplete="name"></div>
                <div class="field"><label for="c-email" data-i18n="sheet.contactEmail">E-Mail</label><input id="c-email" type="email" autocomplete="email"></div>
                <div class="field"><label for="default-country" data-i18n="sheet.defaultCountry">Land</label><select id="default-country"></select></div>
            </div>
            <div class="btn-row" style="margin-top:10px">
                <button type="button" class="btn" id="contact-save" data-i18n="sheet.contactSave">Speichern</button>
                <span id="contact-state" class="save-state"></span>
            </div>
            <p class="muted" style="margin:12px 0 0;font-size:.88rem" data-i18n="sheet.how"></p>
        </section>

        <section class="sheet-wrap" id="sheet-wrap">
            <div class="sheet-tools">
                <h2 data-i18n="sheet.starters">Starter</h2>
                <button type="button" class="btn" id="add-5" data-i18n="sheet.add5">5 Zeilen hinzufügen</button>
            </div>
            <div class="scroll" id="scroll"><table class="sheet" id="sheet"></table></div>
            <details class="legend"><summary data-i18n="sheet.legend">Wertungen</summary><div class="legend-grid" id="legend"></div></details>
        </section>
    </div>

    <div class="footer">
        <div class="footer-in">
            <div style="display:grid;gap:4px">
                <div class="totals" id="totals"></div>
                <span id="save-state" class="save-state" role="status"></span>
            </div>
            <div class="btn-row">
                <label class="consent" id="consent-box" hidden>
                    <input type="checkbox" id="consent"><span data-i18n="sheet.consent"></span>
                </label>
                <button type="button" class="btn primary" id="save" data-i18n="sheet.save">Speichern</button>
            </div>
        </div>
    </div>
    <script type="module" src="sheet.js"></script>
</body>
</html>
