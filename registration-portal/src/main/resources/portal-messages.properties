# Texts the portal's API sends back, English (the reference language).
# {0}, {1}, ... are replaced by the arguments.
error.unknown=Unknown error
error.internal=Something went wrong on the server. Please try again later.
error.request=The request could not be processed.
error.noSuchPath=There is nothing at this address.
request.tooLarge=The request is too large (at most {0} KB).
meet.notFound=Meet {0} not found
request.required={0} is required
request.mustBeText={0} must be text
request.tooLong={0} may be at most {1} characters long
request.date={0} must be a date (YYYY-MM-DD)
admin.localOnly=The organiser pages are not available yet.
meet.changed=Someone else changed this meet in the meantime. The current state is shown.
meet.badKey=The key may contain only lowercase letters, digits and dashes (at most 40), e.g. ooe-lm-2027.
meet.keyInUse=Another meet already uses the key "{0}".
meet.badTimeZone=Unknown time zone "{0}".
meet.badDeadline=The deadline must be a date and time, e.g. 2027-04-30T23:59.
meet.deleteBeforeMeet=The registrations cannot be deleted before the meet.
meet.badStatus=Unknown status "{0}".
meet.otherOpen=Only one meet can be open for registration at a time; "{0}" is open. Close it first.
meet.openWithoutRankings=Upload the rankings and the discipline catalog before opening the registration.
meet.openWithoutDeadline=Set a registration deadline before opening the registration.
meet.closedNoUpload=The registration of this meet is closed; reopen it to upload new rankings.
snapshot.notRankings=This is not a rankings file from the MLAICC Manager (format {0}).
snapshot.notCatalog=This is not a discipline catalog from the MLAICC Manager (format {0}).
snapshot.newerVersion=The file ({0}) comes from a newer version of the MLAICC Manager. Update the portal.
snapshot.duplicateRanking=The rankings file lists ranking {0} twice.
snapshot.emptyEntry=Ranking "{0}" has an entry without disciplines.
snapshot.unknownDiscipline=Ranking "{0}" uses discipline {1}, which the catalog does not have. Export both files from the same installation.
snapshot.teamDiscipline=The individual ranking "{0}" uses the team discipline "{1}".
snapshot.noIndividual=The rankings file has no individual ranking clubs could register for.
snapshot.inactive=Ranking "{0}" uses "{1}", which the catalog marks as inactive.
snapshot.breaksChoices=The new rankings would drop or change entries {0} starter(s) already ticked. Keep those rankings or change the starters first.
