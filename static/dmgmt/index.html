<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disciplines · MLAICC Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-gray-50 has-sidebar">
    <main class="mx-auto py-6 sm:px-6 lg:px-8">
        <h2 id="page-title" class="px-4 pt-6 mb-6 text-2xl font-bold text-gray-900 no-print">Disciplines</h2>
        <div id="message" class="mx-4 mb-4 px-4 py-3 rounded-md hidden no-print"></div>

        <div class="px-4">
            <!-- Add Discipline Form (hidden by default) -->
            <div id="add-form-container" class="bg-white rounded-lg shadow-md p-6 mb-6 hidden">
                <h3 class="text-lg font-semibold mb-4" id="form-title">Add Discipline</h3>
                <form id="discipline-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <input type="hidden" id="form-id" value="">
                    <div>
                        <label for="form-event" class="block text-sm font-medium text-gray-700 mb-1">Event Name</label>
                        <input type="text" id="form-event" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Miquelet">
                    </div>
                    <div>
                        <label for="form-category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
                        <select id="form-category" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="rifle">Rifle</option>
                            <option value="pistol">Pistol</option>
                        </select>
                    </div>
                    <div>
                        <label for="form-level" class="block text-sm font-medium text-gray-700 mb-1">Level</label>
                        <select id="form-level" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="individual">Individual</option>
                            <option value="team">Team</option>
                        </select>
                    </div>
                    <div>
                        <label for="form-type" class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                        <select id="form-type" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="original">Original</option>
                            <option value="reproduction">Reproduction</option>
                            <option value="combined">Combined</option>
                            <option value="open">Open</option>
                        </select>
                    </div>
                    <div id="based-on-group">
                        <label for="form-based-on" class="block text-sm font-medium text-gray-700 mb-1">Based On</label>
                        <input type="text" id="form-based-on" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="e.g. Miquelet">
                    </div>
                    <div id="team-size-group">
                        <label for="form-team-size" class="block text-sm font-medium text-gray-700 mb-1">Team Size</label>
                        <input type="number" id="form-team-size" min="2" max="20" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" value="3">
                    </div>
                    <div>
                        <label for="form-shooting-distance" class="block text-sm font-medium text-gray-700 mb-1">Shooting Distance</label>
                        <select id="form-shooting-distance" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">any distance</option>
                        </select>
                    </div>
                    <div class="flex items-end gap-2 md:col-span-2 lg:col-span-3">
                        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">Save</button>
                        <button type="button" id="cancel-btn" class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Discipline List -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
                    <h3 class="text-lg font-semibold">Disciplines</h3>
                    <div class="flex items-center gap-3">
                        <button id="save-distances-btn" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors hidden">Save Shooting Distances</button>
                        <button id="add-btn" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition-colors">Add Discipline</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Event</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Category</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Level</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Team Info</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Active</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Shooting Distance</th>
                                <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider no-print">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="discipline-table-body" class="divide-y divide-gray-200">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="../js/appNav.js"></script>
    <script type="module" src="dmgmt.js"></script>
</body>
</html>
