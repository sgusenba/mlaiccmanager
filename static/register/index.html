<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration (Demo) · MLAICC Manager</title>
    <link rel="icon" type="image/png" href="/img/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="register.css">
</head>
<!-- Demo of an online registration form for starters: shows this meet's
     individual rankings, but only reads data and never saves anything -->
<body class="bg-gray-50 has-sidebar">
    <main class="mx-auto py-6 sm:px-6 lg:px-8">
        <h2 class="px-4 pt-6 mb-6 text-2xl font-bold text-gray-900" data-i18n="register.title">Registration (Demo)</h2>
        <div id="message" class="mx-4 mb-4 px-4 py-3 rounded-md hidden"></div>

        <div class="px-4 space-y-6 max-w-6xl">
            <div class="flex flex-wrap items-center justify-between gap-4 px-4 py-3 rounded-md bg-amber-50 text-amber-900 border border-amber-200 text-sm">
                <p class="max-w-3xl" data-i18n-html="register.demoNote">
                    <strong>Demo.</strong> This is how an online registration form for starters could look. It shows
                    this meet's individual rankings, but nothing is saved: no competitor and no start is created.
                </p>
                <div class="reg-switch" role="group" aria-label="Layout" data-i18n-aria-label="register.variant">
                    <button type="button" data-variant="list" aria-pressed="true" data-i18n="register.variant.list">List</button>
                    <button type="button" data-variant="cards" aria-pressed="false" data-i18n="register.variant.cards">Cards per firearm</button>
                    <button type="button" data-variant="wizard" aria-pressed="false" data-i18n="register.variant.wizard">Step by step</button>
                </div>
            </div>

            <header class="space-y-1">
                <p class="reg-eyebrow" data-i18n="register.eyebrow">Online Registration</p>
                <h3 id="meet-name" class="text-xl font-bold text-gray-900"></h3>
                <p id="meet-facts" class="text-sm text-gray-600 flex flex-wrap gap-x-5 gap-y-1"></p>
            </header>

            <p id="variant-intro" class="text-sm text-gray-600 max-w-3xl"></p>
            <div id="app"></div>
        </div>
    </main>

    <script type="module" src="../js/appNav.js"></script>
    <script type="module" src="register.js"></script>
</body>
</html>
