<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Results · MLAICC Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<!-- Just the Enter Results section of the main page, without the sidebar; the
     results port (5001) serves only this page, for result entry stations -->
<body class="bg-gray-50">
    <main class="max-w-5xl mx-auto py-6 sm:px-6 lg:px-8">
        <div class="px-4 py-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900 flex items-center">
                    <svg class="h-8 w-8 mr-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                    Results
                </h2>
            </div>

            <!-- Search Section -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <div class="mb-4">
                    <h3 class="text-lg font-semibold text-gray-900">Search for a Start</h3>
                    <p class="text-sm text-gray-600">Enter a start ID to find and add results for that specific start</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Start ID *</label>
                        <input type="text" id="result-start-search" autofocus placeholder="Enter start ID (e.g., 1-52-1)..."
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">&nbsp;</label>
                        <div class="flex space-x-2">
                            <button id="search-start-btn" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                                Search
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Selected Start Info and Result Form -->
            <div id="selected-start-info" class="hidden">
                <!-- Start details and result form will be displayed here -->
            </div>
        </div>
    </main>

    <script type="module" src="results.js"></script>
</body>
</html>
