<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-blue-600 text-white shadow-lg no-print">
        <div class="mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-wrap items-center justify-between min-h-16 py-2 gap-2">
                <div class="flex items-center">
                    <svg class="h-8 w-8 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                    <h1 class="text-xl font-bold">Team Management</h1>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <a href="#teams" class="nav-link px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-700 transition-colors">Teams</a>
                    <a href="#ranking" class="nav-link px-3 py-2 rounded-md text-sm font-medium hover:bg-blue-700 transition-colors">Team Ranking</a>
                    <a href="../rmgmt/" class="px-3 py-2 rounded-md text-sm font-medium text-blue-100 hover:bg-blue-700 transition-colors border-l border-blue-500">Relay Management</a>
                    <a href="../dmgmt/" class="px-3 py-2 rounded-md text-sm font-medium text-blue-100 hover:bg-blue-700 transition-colors">Discipline Management</a>
                    <a href="../ranking/" class="px-3 py-2 rounded-md text-sm font-medium text-blue-100 hover:bg-blue-700 transition-colors">Ranking</a>
                    <a href="../" class="px-3 py-2 rounded-md text-sm font-medium text-blue-100 hover:bg-blue-700 transition-colors">Competition Management</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="mx-auto py-6 sm:px-6 lg:px-8">
        <div id="message" class="mx-4 mb-4 px-4 py-3 rounded-md hidden no-print"></div>

        <!-- Teams Section -->
        <div id="teams-section" class="section px-4">
            <div class="bg-white rounded-lg shadow-md p-6 mb-6">
                <div class="flex flex-wrap items-end gap-3">
                    <div class="min-w-0 max-w-full">
                        <label for="discipline-select" class="block text-sm font-medium text-gray-700 mb-1">Team discipline</label>
                        <select id="discipline-select" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 max-w-full"></select>
                    </div>
                    <button id="new-team-btn" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition-colors">New Team</button>
                </div>
                <p id="discipline-info" class="text-sm text-gray-600 mt-3"></p>
            </div>

            <!-- Team editor (hidden until a team is added or edited) -->
            <form id="team-form" class="bg-white rounded-lg shadow-md p-6 mb-6 hidden" autocomplete="off">
                <div class="flex justify-between items-start mb-4 gap-2">
                    <h3 class="text-lg font-semibold" id="team-form-title">New Team</h3>
                    <button type="button" id="close-team-form-btn" class="text-gray-500 hover:text-gray-700" title="Close">&times;</button>
                </div>

                <div id="member-slots" class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-4"></div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                    <div>
                        <label for="team-name" class="block text-sm font-medium text-gray-700 mb-1">Team name</label>
                        <input type="text" id="team-name" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <p class="text-xs text-gray-500 mt-1">
                            <span id="team-name-hint"></span>
                            <button type="button" id="reset-name-btn" class="text-blue-600 hover:underline ml-1 hidden">Use default</button>
                        </p>
                    </div>
                    <div>
                        <label for="team-tie-break" class="block text-sm font-medium text-gray-700 mb-1">Tie-break (lower wins)</label>
                        <input type="number" id="team-tie-break" step="any" min="0" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Distance of the furthest shot">
                        <p class="text-xs text-gray-500 mt-1">Only decides when total and all ring counts are equal.</p>
                    </div>
                    <div>
                        <label for="team-notes" class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                        <input type="text" id="team-notes" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="flex justify-end gap-3">
                    <button type="button" id="cancel-team-btn" class="px-4 py-2 border border-gray-300 rounded-md hover:bg-gray-50 transition-colors">Cancel</button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">Save Team</button>
                </div>
            </form>

            <div id="teams-list" class="space-y-4"></div>
            <div id="no-teams" class="text-center py-12 text-gray-500 hidden">No teams for this discipline yet. Add the first one with "New Team".</div>
        </div>

        <!-- Team Ranking Section -->
        <div id="ranking-section" class="section hidden px-4">
            <div class="flex flex-wrap items-center gap-3 mb-6 no-print">
                <select id="ranking-select" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 max-w-full"></select>
                <button id="print-ranking-btn" class="ml-auto bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 transition-colors">Print</button>
            </div>
            <div id="ranking-content" class="space-y-8"></div>
        </div>
    </main>

    <script type="module" src="tmgmt.js"></script>
</body>
</html>
