# Monthly dependency check of the registration portal, the only part of this
# repository that runs on the internet (deploy/portal/setup.md, step 5).
# Minor and patch updates come as one pull request; a new major version as
# its own. GitHub's security alerts are separate and come at once.
version: 2
updates:
  - package-ecosystem: maven
    directory: /registration-portal
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      portal-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "Portal dependencies"
