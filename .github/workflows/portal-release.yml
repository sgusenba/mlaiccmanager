name: Build and release the registration portal

# Builds registration-portal/ (one jar, the pages inside) and publishes it on
# its own rolling "portal-latest" release, next to the install and update
# scripts and unit files of deploy/portal/ and their SHA256SUMS, which
# portal-install.sh and portal-update.sh download, and a portable Windows zip
# (mlaic-portal-windows.zip) with Java bundled. It never touches the
# Manager's "latest" release, which the installations at the ranges update from.

on:
  push:
    branches: [main]
    paths:
      - 'registration-portal/**'
      - 'deploy/portal/**'
      - '.github/workflows/portal-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -f registration-portal/pom.xml clean verify -Dportal.commit=${GITHUB_SHA::7}

      - name: Collect release files
        run: |
          mkdir -p portal-release
          cp registration-portal/target/mlaic-portal-*[0-9].jar portal-release/mlaic-portal.jar
          cp deploy/portal/portal-install.sh deploy/portal/portal-update.sh deploy/portal/portal-backup.sh \
             deploy/portal/portal-restore.sh deploy/portal/portal-cli.sh \
             deploy/portal/mlaic-portal.service deploy/portal/mlaic-portal-update.service \
             deploy/portal/mlaic-portal-backup.service deploy/portal/mlaic-portal-backup.timer \
             deploy/portal/Caddyfile.example deploy/portal/portal.env.example \
             deploy/portal/windows/start.bat deploy/portal/windows/start.ps1 \
             deploy/portal/windows/update.ps1 deploy/portal/windows/portal-cli.bat portal-release/
          (cd portal-release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          java -jar portal-release/mlaic-portal.jar --version

      # Portable Windows zip: the jar, a Windows JRE and the launcher scripts of
      # deploy/portal/windows/, which update the jar from SHA256SUMS above on every
      # start. Built after SHA256SUMS, so the zip itself is not listed there
      - name: Package Windows bundle
        run: |
          curl -fsSL -o jre.zip "https://api.adoptium.net/v3/binary/latest/21/ga/windows/x64/jre/hotspot/normal/eclipse"
          unzip -q jre.zip -d jre-extract
          mkdir -p win-bundle/mlaic-portal
          mv jre-extract/* win-bundle/mlaic-portal/jre
          cp portal-release/mlaic-portal.jar deploy/portal/windows/start.bat deploy/portal/windows/start.ps1 \
             deploy/portal/windows/update.ps1 deploy/portal/windows/portal-cli.bat win-bundle/mlaic-portal/
          (cd win-bundle && zip -qr ../portal-release/mlaic-portal-windows.zip mlaic-portal)

      # The rolling release keeps files of earlier builds; the tarball of the old layout is gone
      - name: Remove outdated release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in mlaic-portal-dist.tar.gz mlaic-portal-dist.tar.gz.sha256; do
            gh release delete-asset portal-latest "$f" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          done

      - name: Publish "portal-latest" release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: portal-latest
          name: Registration portal (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            The MLAIC registration portal: one jar (`mlaic-portal.jar`) with the pages inside.

            **Install on a Linux machine** (Debian/Ubuntu), as root:
            ```
            curl -fsSLO https://github.com/${{ github.repository }}/releases/download/portal-latest/portal-install.sh
            sudo bash portal-install.sh --domain anmeldung.example.org --email you@example.org
            ```
            Before every start the portal checks this release for a newer build and installs it. Details: `deploy/portal/setup.md`.

            **Try it on Windows:** download `mlaic-portal-windows.zip` (Java included), unzip it, create an organiser account with `portal-cli.bat` and start the portal with `start.bat` (http://localhost:8080).
          files: portal-release/*
