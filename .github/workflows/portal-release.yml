name: Build and release the registration portal

# Builds registration-portal/ and publishes it as one tarball (jar, static/,
# and deploy/ with the scripts and unit files of deploy/portal/, which
# portal-deploy.sh installs on the VM) on its own rolling "portal-latest"
# release. It never touches the Manager's
# "latest" release, which the installations at the ranges update from.

on:
  push:
    branches: [main]
    paths:
      - 'registration-portal/**'
      - 'deploy/portal/**'
      - '.github/workflows/portal-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -f registration-portal/pom.xml clean verify

      - name: Package portal bundle
        run: |
          mkdir -p portal-bundle
          cp registration-portal/target/mlaic-portal-*.jar portal-bundle/mlaic-portal.jar
          cp -r registration-portal/static portal-bundle/static
          cp -r deploy/portal portal-bundle/deploy
          echo "{\"buildTime\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"commit\": \"${GITHUB_SHA}\"}" > portal-bundle/build-info.json
          tar -czf mlaic-portal-dist.tar.gz -C portal-bundle .
          sha256sum mlaic-portal-dist.tar.gz > mlaic-portal-dist.tar.gz.sha256

      - name: Publish "portal-latest" release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: portal-latest
          name: Registration portal (latest build)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            mlaic-portal-dist.tar.gz
            mlaic-portal-dist.tar.gz.sha256
