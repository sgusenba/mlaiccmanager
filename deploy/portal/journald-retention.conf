# Keep the system journal (the portal's log: log-ins, failed log-ins with the
# client address) for 14 days, as stated in the privacy notice.
# Install: mkdir -p /etc/systemd/journald.conf.d && cp journald-retention.conf /etc/systemd/journald.conf.d/
#          systemctl restart systemd-journald
[Journal]
MaxRetentionSec=14day
